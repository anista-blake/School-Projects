<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Switch Timer Test</title>
<style>
    :root {
        --color-bg: #ffffff;
        --color-text: #000000;
        --color-border: #cccccc;
    }

    [data-theme="dark"] {
        --color-bg: #1e1e1e;
        --color-text: #f0f0f0;
        --color-border: #555555;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        transition: background 0.3s, color 0.3s;
        padding: 20px;
    }

    .theme-test-container {
        max-width: 600px;
        margin: auto;
    }

    textarea {
        width: 100%;
        height: 150px;
        padding: 10px;
        background: var(--color-bg);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
</style>
</head>
<body data-theme="light">

<div class="theme-test-container">
    <h2>Theme Switch Timer Test</h2>
    <p>This page will automatically switch between dark and light mode after the timer reaches zero.</p>

    <div style="margin: 20px 0; font-size: 1.2rem;">
        <strong>Switching theme in:</strong> 
        <span id="countdown">10</span> seconds
    </div>

    <textarea placeholder="Description..."></textarea>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    let seconds = 10;
    const display = document.getElementById("countdown");

    function toggleTheme() {
        const root = document.documentElement;
        const current = root.getAttribute("data-theme");

        root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
    }

    setInterval(() => {
        seconds--;
        display.textContent = seconds;

        if (seconds <= 0) {
            toggleTheme();
            seconds = 10;
        }
    }, 1000);
});
</script>

</body>
</html>
