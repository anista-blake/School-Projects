<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Balance Bloom | Password Reset</title>
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-bottom">
      <h1 class="login-title">Create a new password</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <ul class="login-errors">
            {% for category, message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      <form method="post" action="/auth/reset-password/finish" style="max-width:480px;margin:0 auto">
        
        <input type="hidden" name="token" value="{{ token }}">
        <div>
          <label class="login-label" for="npw">New password</label>
          <input class="login-input" id="npw" name="new_password" type="password" pattern="[A-Za-z0-9_.@]*" required
          minlength="8"
          
          oninvalid="
          if (this.validity.valueMissing) {
              this.setCustomValidity('Please enter a password.');
          } else if (this.validity.tooShort) {
              this.setCustomValidity('Password must be at least 8 characters.');
          } else if (this.validity.patternMismatch) {
              this.setCustomValidity('Password may only contain letters, numbers, and special characters (underscore, period, at symbol)')
          }"

          oninput="this.setCustomValidity('')">

        </div>

        <div>
          <label class="login-label" for="cpw">Confirm password</label>
          <input class="login-input" id="cpw" name="confirm_password" type="password" pattern="[A-Za-z0-9_.@]*" required
          minlength="8"
          oninvalid="this.setCustomValidity('Passwords do not match.')"
          oninput="this.setCustomValidity('')">
        </div>

        <div style="margin-top:12px">
          <button class="login-button" type="submit">Update password</button>
        </div>
      </form>

      <p style="text-align:center;margin-top:12px">
        <a class="login-link" href="{{ url_for('auth.login') }}">Back to login</a>
      </p>
    </div>
  </div>
</body>
</html>
